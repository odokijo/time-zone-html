<p>Tanggal/Waktu: <span id="tanggalwaktu"></span></p>

<script>
var tw = new Date();
if (tw.getTimezoneOffset() == 0) (a=tw.getTime() + ( 7 *60*60*1000))
else (a=tw.getTime());
tw.setTime(a);
var tahun= tw.getFullYear ();
var hari= tw.getDay ();
var bulan= tw.getMonth ();
var tanggal= tw.getDate ();
var hariarray=new Array("Minggu,","Senin,","Selasa,","Rabu,","Kamis,","Jum'at,","Sabtu,");
var bulanarray=new Array("Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","Nopember","Desember");

document.getElementById("tanggalwaktu").innerHTML = hariarray[hari]+" "+tanggal+" "+bulanarray[bulan]+" "+tahun+" Jam " + ((tw.getHours() < 10) ? "0" : "") + tw.getHours() + ":" + ((tw.getMinutes() < 10)? "0" : "") + tw.getMinutes() + (" W.I.B ");

</script>

    <script>
        function updateClock() {
            const tzSelect = document.getElementById('timezone-select').value;
            const clockElement = document.getElementById('clock');

            // Menggunakan Intl.DateTimeFormat untuk mengambil waktu sesuai zona waktu
            const options = {
                timeZone: tzSelect,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const formatter = new Intl.DateTimeFormat('id-ID', options);
            clockElement.textContent = formatter.format(new Date());
        }

        // Jalankan fungsi setiap 1 detik (1000 ms)
        setInterval(updateClock, 1000);

        // Panggil sekali agar tidak ada jeda 1 detik saat pertama dibuka
        updateClock();

        // Update ketika pilihan dropdown zona waktu diubah
        document.getElementById('timezone-select').addEventListener('change', updateClock);
    </script>
